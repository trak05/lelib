<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lelib agent</title>
<style>
:root {
  --bg: #f7f7f5; --panneau: #ffffff; --bord: #e2e2dc; --texte: #1f1f1d; --doux: #6b6b64;
  --accent: #c15f3c; --accent-texte: #ffffff; --utilisateur: #ecebe4; --code: #f0efe9; --erreur: #b3261e; --ok: #2e7d32;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1c1a; --panneau: #262624; --bord: #3a3a36; --texte: #ecebe4; --doux: #9d9c93;
    --accent: #d97757; --accent-texte: #1c1c1a; --utilisateur: #323230; --code: #1f1f1d; --erreur: #f2b8b5; --ok: #81c784;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--texte); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; }
button, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

#lateral { width: 280px; flex: none; background: var(--panneau); border-right: 1px solid var(--bord); display: flex; flex-direction: column; min-height: 0; }
#lateral header { padding: 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--bord); }
#lateral h1 { font-size: 1rem; margin: 0; }
#liste { overflow-y: auto; flex: 1; padding: 8px; }
.conv { display: flex; align-items: center; gap: 4px; border-radius: 8px; }
.conv:hover, .conv.actif { background: var(--utilisateur); }
.conv button.titre { flex: 1; text-align: left; background: none; border: 0; padding: 10px; min-height: 44px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv button.suppr { background: none; border: 0; min-width: 44px; min-height: 44px; color: var(--doux); }
.conv .petit { display: block; font-size: .75rem; color: var(--doux); }

.bouton { background: var(--accent); color: var(--accent-texte); border: 0; border-radius: 8px; padding: 10px 14px; min-height: 44px; font-weight: 600; }
.bouton.secondaire { background: var(--utilisateur); color: var(--texte); font-weight: 400; }
.bouton:disabled { opacity: .5; cursor: default; }

#principal { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
#entete { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--bord); background: var(--panneau); flex-wrap: wrap; }
#burger { display: none; background: none; border: 1px solid var(--bord); border-radius: 8px; min-width: 44px; min-height: 44px; }
#entete select { min-height: 44px; border: 1px solid var(--bord); border-radius: 8px; background: var(--bg); padding: 0 8px; max-width: 100%; }
#entete select:disabled { opacity: .7; }
#titre { flex: 1; min-width: 120px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

#messages { flex: 1; overflow-y: auto; padding: 16px 12px; }
#fil { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.vide { text-align: center; color: var(--doux); margin-top: 15vh; }
.bulle { max-width: 100%; overflow-wrap: anywhere; }
.bulle.utilisateur { align-self: flex-end; background: var(--utilisateur); border-radius: 14px; padding: 8px 14px; max-width: 85%; white-space: pre-wrap; }
.bulle.assistant p { margin: 0 0 .7em; }
.bulle.assistant > :last-child { margin-bottom: 0; }
.bulle.assistant h3, .bulle.assistant h4, .bulle.assistant h5, .bulle.assistant h6 { margin: .8em 0 .3em; }
.bulle.assistant pre { background: var(--code); border: 1px solid var(--bord); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: .6em 0; }
.bulle.assistant code { font: .88em ui-monospace, Consolas, monospace; background: var(--code); border-radius: 4px; padding: 1px 4px; }
.bulle.assistant pre code { background: none; padding: 0; }
.bulle.erreur { color: var(--erreur); border: 1px solid var(--erreur); border-radius: 8px; padding: 8px 12px; }
.outil { border: 1px solid var(--bord); border-radius: 8px; background: var(--panneau); font-size: .88rem; }
.outil summary { padding: 8px 12px; cursor: pointer; min-height: 36px; overflow-wrap: anywhere; }
.outil pre { margin: 0; padding: 8px 12px; border-top: 1px solid var(--bord); white-space: pre-wrap; overflow-wrap: anywhere; font: .82rem ui-monospace, Consolas, monospace; color: var(--doux); }
.outil.ko summary { color: var(--erreur); }
.outil.ok summary::before { content: "✓ "; color: var(--ok); }
.outil.ko summary::before { content: "✗ "; }
.outil.attente summary::before { content: "… "; }
.confirmation { border: 2px solid var(--accent); border-radius: 10px; padding: 12px; background: var(--panneau); }
.confirmation p { margin: 0 0 10px; overflow-wrap: anywhere; }
.confirmation .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.confirmation.fini { border-color: var(--bord); opacity: .75; }
.pied { font-size: .75rem; color: var(--doux); }

#saisie { border-top: 1px solid var(--bord); background: var(--panneau); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
#saisie form { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
#saisie textarea { flex: 1; resize: none; min-height: 44px; max-height: 200px; border: 1px solid var(--bord); border-radius: 10px; padding: 10px 12px; background: var(--bg); font-size: 16px; }

@media (max-width: 767px) {
  #lateral { position: fixed; inset: 0 auto 0 0; z-index: 10; transform: translateX(-100%); transition: transform .2s; width: min(85vw, 320px); }
  body.menu-ouvert #lateral { transform: none; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .35); }
  #burger { display: inline-block; }
  .bulle.utilisateur { max-width: 92%; }
}
</style>
</head>
<body>
<aside id="lateral">
  <header>
    <h1>lelib agent</h1>
    <button class="bouton" id="nouvelle" type="button">Nouvelle conversation</button>
  </header>
  <div id="liste" aria-label="Conversations"></div>
</aside>
<div id="principal">
  <div id="entete">
    <button id="burger" type="button" aria-label="Ouvrir le menu">☰</button>
    <div id="titre">Nouvelle conversation</div>
    <select id="projet" aria-label="Projet"></select>
    <select id="agent" aria-label="Agent"></select>
  </div>
  <div id="messages"><div id="fil"><div class="vide">Pose ta question. L'agent peut lire, chercher et modifier les fichiers du projet choisi.</div></div></div>
  <div id="saisie">
    <form id="formulaire">
      <textarea id="texte" rows="1" placeholder="Écris ton message (Entrée pour envoyer, Maj+Entrée pour une nouvelle ligne)" aria-label="Message"></textarea>
      <button class="bouton" id="envoyer" type="submit">Envoyer</button>
      <button class="bouton secondaire" id="arreter" type="button" hidden>Arrêter</button>
    </form>
  </div>
</div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
let jeton = null;
try {
  const p = new URLSearchParams(location.search).get('t');
  if (p) { sessionStorage.setItem('jeton', p); history.replaceState(null, '', location.pathname); }
  jeton = sessionStorage.getItem('jeton');
} catch { /* stockage indisponible */ }

const etat = { conversation: null, controleur: null, segment: null, outils: new Map() };

async function api(chemin, options = {}) {
  const reponse = await fetch(chemin, { ...options, headers: { 'x-token': jeton || '', 'content-type': 'application/json', ...(options.headers || {}) } });
  return reponse;
}
async function apiJson(chemin, options) {
  const reponse = await api(chemin, options);
  const donnees = await reponse.json().catch(() => ({}));
  if (!reponse.ok) throw new Error(donnees.erreur || `HTTP ${reponse.status}`);
  return donnees;
}

// Rendu Markdown minimal : tout est échappé avant d'être mis en forme, aucun lien cliquable.
function md(texte) {
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = (s) => esc(s).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  return texte.split('```').map((part, i) => {
    if (i % 2 === 1) {
      const nl = part.indexOf('\n');
      return '<pre><code>' + esc((nl >= 0 ? part.slice(nl + 1) : part).replace(/\n$/, '')) + '</code></pre>';
    }
    let sortie = '', liste = null, para = [];
    const fermerPara = () => { if (para.length) { sortie += '<p>' + para.join('<br>') + '</p>'; para = []; } };
    const fermerListe = () => { if (liste) { sortie += '</' + liste + '>'; liste = null; } };
    const ouvrirListe = (type) => { fermerPara(); if (liste !== type) { fermerListe(); sortie += '<' + type + '>'; liste = type; } };
    for (const ligne of part.split('\n')) {
      let m;
      if (!ligne.trim()) { fermerPara(); fermerListe(); }
      else if ((m = /^(#{1,4})\s+(.*)$/.exec(ligne))) { fermerPara(); fermerListe(); const n = m[1].length + 2; sortie += `<h${n}>${inline(m[2])}</h${n}>`; }
      else if ((m = /^\s*[-*]\s+(.*)$/.exec(ligne))) { ouvrirListe('ul'); sortie += '<li>' + inline(m[1]) + '</li>'; }
      else if ((m = /^\s*\d+[.)]\s+(.*)$/.exec(ligne))) { ouvrirListe('ol'); sortie += '<li>' + inline(m[1]) + '</li>'; }
      else { fermerListe(); para.push(inline(ligne)); }
    }
    fermerPara(); fermerListe();
    return sortie;
  }).join('');
}

function proche() { const m = $('messages'); return m.scrollHeight - m.scrollTop - m.clientHeight < 80; }
function defiler(forcer) { const m = $('messages'); if (forcer) m.scrollTop = m.scrollHeight; }
function ajouter(el) {
  const colle = proche();
  const fil = $('fil');
  const vide = fil.querySelector('.vide');
  if (vide) vide.remove();
  fil.appendChild(el);
  defiler(colle);
  return el;
}
function bulle(classe, texte) {
  const el = document.createElement('div');
  el.className = 'bulle ' + classe;
  if (texte !== undefined) el.textContent = texte;
  return el;
}
function ecrireSegment(delta) {
  if (!etat.segment) {
    etat.segment = { brut: '', el: ajouter(bulle('assistant')) };
  }
  const colle = proche();
  etat.segment.brut += delta;
  etat.segment.el.innerHTML = md(etat.segment.brut);
  defiler(colle);
}
function ajouterOutil(id, description) {
  etat.segment = null;
  const d = document.createElement('details');
  d.className = 'outil attente';
  const s = document.createElement('summary');
  s.textContent = description;
  d.appendChild(s);
  etat.outils.set(id, d);
  ajouter(d);
}
function terminerOutil(id, erreur, apercu) {
  const d = etat.outils.get(id);
  if (!d) return;
  d.className = 'outil ' + (erreur ? 'ko' : 'ok');
  if (apercu) { const pre = document.createElement('pre'); pre.textContent = apercu; d.appendChild(pre); }
}
function afficherConfirmation(evt) {
  etat.segment = null;
  const carte = document.createElement('div');
  carte.className = 'confirmation';
  const p = document.createElement('p');
  p.textContent = evt.description;
  const actions = document.createElement('div');
  actions.className = 'actions';
  const repondre = async (ok, toujours) => {
    carte.classList.add('fini');
    actions.remove();
    const note = document.createElement('div');
    note.className = 'pied';
    note.textContent = ok ? (toujours ? 'Autorisé pour cette conversation' : 'Autorisé') : 'Refusé';
    carte.appendChild(note);
    try { await apiJson('/api/confirmation', { method: 'POST', body: JSON.stringify({ id: evt.id, ok, toujours }) }); } catch (e) { note.textContent += ' (' + e.message + ')'; }
  };
  for (const [libelle, ok, toujours, secondaire] of [['Autoriser', true, false, false], ['Autoriser pour cette conversation', true, true, true], ['Refuser', false, false, true]]) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'bouton' + (secondaire ? ' secondaire' : '');
    b.textContent = libelle;
    b.addEventListener('click', () => repondre(ok, toujours));
    actions.appendChild(b);
  }
  carte.append(p, actions);
  ajouter(carte);
}

function enCours(oui) {
  $('envoyer').hidden = oui;
  $('arreter').hidden = !oui;
  $('texte').disabled = oui;
  if (!oui) $('texte').focus();
}

function reinitialiserFil() {
  etat.segment = null;
  etat.outils.clear();
  $('fil').innerHTML = '<div class="vide">Pose ta question. L\'agent peut lire, chercher et modifier les fichiers du projet choisi.</div>';
}

async function chargerAgents(projet, valeur) {
  const agents = await apiJson('/api/agents?projet=' + encodeURIComponent(projet));
  const select = $('agent');
  select.innerHTML = '';
  const defaut = new Option('Généraliste', '');
  select.add(defaut);
  for (const a of agents) { const o = new Option(`${a.nom} (${a.plugin})`, a.nom); o.title = a.description; select.add(o); }
  select.value = valeur || '';
}

async function rafraichirListe() {
  const liste = await apiJson('/api/conversations');
  const conteneur = $('liste');
  conteneur.innerHTML = '';
  for (const c of liste) {
    const ligne = document.createElement('div');
    ligne.className = 'conv' + (c.id === etat.conversation ? ' actif' : '');
    const t = document.createElement('button');
    t.type = 'button';
    t.className = 'titre';
    t.textContent = c.titre;
    const petit = document.createElement('span');
    petit.className = 'petit';
    petit.textContent = `${c.projet.split(/[\\/]/).filter(Boolean).pop() || c.projet} · ${c.agent || 'généraliste'}`;
    t.appendChild(petit);
    t.addEventListener('click', () => ouvrir(c.id));
    const s = document.createElement('button');
    s.type = 'button';
    s.className = 'suppr';
    s.setAttribute('aria-label', 'Supprimer la conversation');
    s.textContent = '🗑';
    s.addEventListener('click', async () => {
      if (!confirm('Supprimer cette conversation ?')) return;
      try { await apiJson('/api/conversations/' + c.id, { method: 'DELETE' }); } catch (e) { alert(e.message); return; }
      if (etat.conversation === c.id) nouvelle();
      rafraichirListe();
    });
    ligne.append(t, s);
    conteneur.appendChild(ligne);
  }
}

function nouvelle() {
  if (etat.controleur) return;
  etat.conversation = null;
  $('titre').textContent = 'Nouvelle conversation';
  $('projet').disabled = false;
  $('agent').disabled = false;
  reinitialiserFil();
  fermerMenu();
  rafraichirListe().catch(() => {});
}

async function ouvrir(id) {
  if (etat.controleur) return;
  try {
    const conv = await apiJson('/api/conversations/' + id);
    etat.conversation = conv.id;
    $('titre').textContent = conv.titre;
    $('projet').value = conv.projet;
    await chargerAgents(conv.projet, conv.agent);
    $('projet').disabled = true;
    $('agent').disabled = true;
    reinitialiserFil();
    for (const m of conv.messages) {
      if (m.role === 'user') {
        if (typeof m.content === 'string') ajouter(bulle('utilisateur', m.content));
        else for (const b of m.content) if (b.type === 'tool_result') terminerOutil(b.tool_use_id, b.is_error, typeof b.content === 'string' ? b.content.slice(0, 300) : '');
      } else {
        for (const b of m.content) {
          if (b.type === 'text' && b.text) { etat.segment = null; ecrireSegment(b.text); etat.segment = null; }
          else if (b.type === 'tool_use') ajouterOutil(b.id, b.name + ' ' + (b.input && (b.input.path || b.input.command || b.input.pattern || b.input.name || b.input.agent) || ''));
        }
      }
    }
    defiler(true);
    rafraichirListe();
    fermerMenu();
  } catch (e) { ajouter(bulle('erreur', e.message)); }
}

async function envoyer(message) {
  ajouter(bulle('utilisateur', message));
  etat.segment = null;
  enCours(true);
  etat.controleur = new AbortController();
  const corps = { message };
  if (etat.conversation) corps.conversation = etat.conversation;
  else { corps.projet = $('projet').value; corps.agent = $('agent').value || null; }
  let termine = false;
  try {
    const reponse = await api('/api/chat', { method: 'POST', body: JSON.stringify(corps), signal: etat.controleur.signal });
    if (!reponse.ok) {
      const d = await reponse.json().catch(() => ({}));
      throw new Error(d.erreur || `HTTP ${reponse.status}`);
    }
    const lecteur = reponse.body.getReader();
    const decodeur = new TextDecoder();
    let tampon = '';
    for (;;) {
      const { done, value } = await lecteur.read();
      if (done) break;
      tampon += decodeur.decode(value, { stream: true });
      let i;
      while ((i = tampon.indexOf('\n\n')) >= 0) {
        const brut = tampon.slice(0, i);
        tampon = tampon.slice(i + 2);
        const type = (/^event: (.*)$/m.exec(brut) || [])[1];
        const data = (/^data: (.*)$/m.exec(brut) || [])[1];
        if (type && data) { termine = traiter(type, JSON.parse(data)) || termine; }
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') ajouter(bulle('erreur', e.message));
    else { const p = bulle('pied', 'Interrompu'); p.className = 'pied'; ajouter(p); }
  } finally {
    etat.controleur = null;
    etat.segment = null;
    enCours(false);
    if (etat.conversation) { $('projet').disabled = true; $('agent').disabled = true; }
    rafraichirListe().catch(() => {});
  }
  return termine;
}

function traiter(type, d) {
  if (type === 'conversation') { etat.conversation = d.id; $('titre').textContent = d.titre; }
  else if (type === 'texte') ecrireSegment(d.delta);
  else if (type === 'outil') ajouterOutil(d.id, (d.agent ? `[${d.agent}] ` : '') + d.description);
  else if (type === 'resultat') terminerOutil(d.id, d.erreur, d.apercu);
  else if (type === 'confirmation') afficherConfirmation(d);
  else if (type === 'erreur') ajouter(bulle('erreur', d.message));
  else if (type === 'fin') {
    const p = document.createElement('div');
    p.className = 'pied';
    p.textContent = `${d.usage.entree} tokens en entrée · ${d.usage.sortie} en sortie` + (d.arret === 'limite' ? ' · limite de tours atteinte' : d.arret === 'max_tokens' ? ' · réponse coupée (longueur)' : '');
    ajouter(p);
    return true;
  }
  return false;
}

function fermerMenu() { document.body.classList.remove('menu-ouvert'); }

async function demarrer() {
  if (!jeton) {
    reinitialiserFil();
    $('fil').innerHTML = '<div class="vide">Ouvre l\'adresse affichée dans le terminal au lancement de <code>lelib-agent --chat</code> (elle contient le jeton d\'accès).</div>';
    $('envoyer').disabled = true;
    return;
  }
  try {
    const config = await apiJson('/api/config');
    for (const p of config.projets) $('projet').add(new Option(p.nom, p.chemin));
    await chargerAgents($('projet').value, '');
    await rafraichirListe();
  } catch (e) { ajouter(bulle('erreur', e.message)); }
}

$('projet').addEventListener('change', () => chargerAgents($('projet').value, '').catch((e) => ajouter(bulle('erreur', e.message))));
$('nouvelle').addEventListener('click', nouvelle);
$('burger').addEventListener('click', () => document.body.classList.toggle('menu-ouvert'));
$('arreter').addEventListener('click', () => etat.controleur && etat.controleur.abort());
$('formulaire').addEventListener('submit', (e) => {
  e.preventDefault();
  const t = $('texte');
  const message = t.value.trim();
  if (!message || etat.controleur) return;
  t.value = '';
  t.style.height = 'auto';
  envoyer(message);
});
$('texte').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('formulaire').requestSubmit(); }
});
$('texte').addEventListener('input', (e) => { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 200) + 'px'; });
demarrer();
</script>
</body>
</html>
